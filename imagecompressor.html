<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Image Compressor</title>
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      color: #1f2937;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 680px;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h2 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }
    .header p {
      color: #6b7280;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* Upload Box */
    .upload-box {
      border: 2px dashed #818cf8;
      border-radius: 14px;
      padding: 2rem 1.5rem;
      text-align: center;
      background: #f5f3ff;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 1.75rem;
    }
    .upload-box:hover {
      border-color: #4f46e5;
      background: #ede9fe;
      transform: translateY(-2px);
    }
    .upload-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: #e0e7ff;
      color: #4f46e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
    }
    .upload-title {
      font-weight: 600;
      color: #4f46e5;
      font-size: 1rem;
    }
    .upload-sub {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 4px;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 1.75rem;
    }
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .option-group label {
      font-size: 0.825rem;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .option-group select {
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.925rem;
      font-family: inherit;
      color: #1f2937;
      background-color: #f9fafb;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .option-group select:focus {
      border-color: #4f46e5;
      background-color: #fff;
    }

    /* Side-by-Side Image Comparison */
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 1.75rem;
    }
    .preview-card {
      background: #f9fafb;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      text-align: center;
    }
    .preview-card .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .badge-before {
      background: #fee2e2;
      color: #dc2626;
    }
    .badge-after {
      background: #dcfce7;
      color: #16a34a;
    }
    .preview-card img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    /* Metrics Section */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: #f3f4f6;
      padding: 1.25rem 1rem;
      border-radius: 14px;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .metric-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .metric-value {
      font-weight: 700;
      font-size: 1.1rem;
      color: #111827;
      margin-top: 4px;
    }
    .metric-value.highlight {
      color: #059669;
    }

    /* Status Message */
    .status-msg {
      font-size: 0.875rem;
      font-weight: 500;
      color: #1e40af;
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      text-align: left;
      display: none;
    }

    /* Action Button */
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      text-align: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- Header -->
  <div class="header">
    <h2>Smart Image Compressor</h2>
    <p>Reduce file size instantly without compromising visual clarity</p>
  </div>
  
  <!-- Upload Box -->
  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">↑</div>
    <div class="upload-title">Click or Drag Image Here to Compress</div>
    <div class="upload-sub">Supports High-Resolution JPG, PNG, and WebP</div>
    <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
  </div>

  <!-- User Option Controls -->
  <div class="options-grid">
    <div class="option-group">
      <label for="formatSelect">Output Format</label>
      <select id="formatSelect">
        <option value="image/jpeg">JPG / JPEG</option>
        <option value="image/webp">WebP (Modern)</option>
        <option value="image/png">PNG</option>
      </select>
    </div>

    <div class="option-group">
      <label for="targetSizeSelect">Target Compressed Size</label>
      <select id="targetSizeSelect">
        <option value="max">Max Reduction (Cap at 75%)</option>
        <option value="250">Under 250 KB</option>
        <option value="500">Under 500 KB</option>
        <option value="1024">Under 1 MB</option>
        <option value="2048">Under 2 MB</option>
      </select>
    </div>
  </div>

  <!-- Side-by-Side Image Comparison -->
  <div class="preview-grid" id="previewGrid" style="display: none !important;">
    <div class="preview-card">
      <span class="badge badge-before">Original</span>
      <img id="imgBefore" src="" alt="Original Image">
    </div>
    <div class="preview-card">
      <span class="badge badge-after">Compressed</span>
      <img id="imgAfter" src="" alt="Compressed Image">
    </div>
  </div>

  <!-- Metrics Display -->
  <div class="metrics">
    <div>
      <div class="metric-title">Original Size</div>
      <div class="metric-value" id="origSize">-</div>
    </div>
    <div>
      <div class="metric-title">Compressed Size</div>
      <div class="metric-value" id="compSize">-</div>
    </div>
    <div>
      <div class="metric-title">Reduction</div>
      <div class="metric-value highlight" id="reduction">-</div>
    </div>
  </div>

  <!-- Status Info -->
  <div class="status-msg" id="statusMsg"></div>

  <!-- Action Button -->
  <a id="downloadBtn" class="btn" style="display:none;" download="compressed.jpg">Download Compressed Image</a>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const formatSelect = document.getElementById('formatSelect');
  const targetSizeSelect = document.getElementById('targetSizeSelect');

  const previewGrid = document.getElementById('previewGrid');
  const imgBefore = document.getElementById('imgBefore');
  const imgAfter = document.getElementById('imgAfter');

  const origSizeEl = document.getElementById('origSize');
  const compSizeEl = document.getElementById('compSize');
  const reductionEl = document.getElementById('reduction');
  const statusMsgEl = document.getElementById('statusMsg');
  const downloadBtn = document.getElementById('downloadBtn');

  let currentFile = null;
  const MIN_QUALITY_THRESHOLD = 0.50; // Quality threshold safeguard

  fileInput.addEventListener('change', function(e) {
    if (e.target.files.length) {
      currentFile = e.target.files[0];
      
      // Reveal side-by-side preview grid immediately on file selection
      previewGrid.setAttribute("style", "display: grid !important;");
      
      processImage();
    }
  });

  formatSelect.addEventListener('change', processImage);
  targetSizeSelect.addEventListener('change', processImage);

  function processImage() {
    if (!currentFile) return;

    const originalSizeBytes = currentFile.size;
    origSizeEl.textContent = formatBytes(originalSizeBytes);

    const selectedFormat = formatSelect.value;
    const selectedTarget = targetSizeSelect.value;

    const reader = new FileReader();
    reader.readAsDataURL(currentFile);
    reader.onload = function(event) {
      // Set Before Image Preview
      imgBefore.src = event.target.result;

      const img = new Image();
      img.src = event.target.result;

      img.onload = function() {
        // Guarantee unchanged dimensions
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        let bestDataUrl = "";
        let bestSizeBytes = originalSizeBytes;
        let bestReduction = 0;
        let terminationReason = "";

        let targetSizeBytes = Infinity;
        if (selectedTarget !== "max") {
          targetSizeBytes = parseInt(selectedTarget) * 1024;
        }

        for (let quality = 0.95; quality >= 0.10; quality -= 0.05) {
          if (quality < MIN_QUALITY_THRESHOLD) {
            terminationReason = "Stopped at 50% quality threshold to prevent visible blurring or artifacts.";
            break;
          }

          const currentDataUrl = canvas.toDataURL(selectedFormat, quality);
          const head = `data:${selectedFormat};base64,`;
          const currentSizeBytes = Math.round((currentDataUrl.length - head.length) * 3 / 4);
          const currentReduction = ((originalSizeBytes - currentSizeBytes) / originalSizeBytes) * 100;

          bestDataUrl = currentDataUrl;
          bestSizeBytes = currentSizeBytes;
          bestReduction = currentReduction;

          if (selectedTarget !== "max" && currentSizeBytes <= targetSizeBytes) {
            terminationReason = `Target size under ${formatBytes(targetSizeBytes)} achieved!`;
            break;
          }

          if (selectedTarget === "max" && currentReduction >= 75) {
            terminationReason = "Maximum compression cap of 75% reached.";
            break;
          }
        }

        // Set After Image Preview
        imgAfter.src = bestDataUrl;

        // Update Metrics & Status
        compSizeEl.textContent = formatBytes(bestSizeBytes);
        reductionEl.textContent = (bestReduction > 0 ? bestReduction.toFixed(1) : '0') + '%';

        statusMsgEl.style.display = 'block';
        statusMsgEl.textContent = terminationReason || "Image compressed successfully!";

        // Setup Download Button
        const ext = selectedFormat.split('/')[1];
        const baseName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || currentFile.name;
        
        downloadBtn.href = bestDataUrl;
        downloadBtn.style.display = 'block';
        downloadBtn.download = `compressed_${baseName}.${ext}`;
      };
    };
  }

  function formatBytes(bytes) {
    if (bytes <= 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }
</script>

</body>
</html>
